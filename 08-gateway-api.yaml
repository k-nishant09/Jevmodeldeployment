# -----------------------------------------------------------------------------
# 5. NetworkPolicy for team namespace access control
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: open-jev-team-access
  namespace: jev-model
  labels:
    app: open-jev
spec:
  podSelector:
    matchLabels:
      app: open-jev
  policyTypes:
    - Ingress
  ingress:
    # Allow from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: openshift-monitoring
      ports:
        - protocol: TCP
          port: 8791
    # Allow from team namespaces (label team namespaces with 'team: <team-name>')
    - from:
        - namespaceSelector:
            matchLabels:
              team-access: "enabled"
      ports:
        - protocol: TCP
          port: 8791
    # Allow from same namespace
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8791
    # Allow from Service Mesh ingress (if using Istio)
    - from:
        - namespaceSelector:
            matchLabels:
              istio-injection: enabled
      ports:
        - protocol: TCP
          port: 8791
---
# -----------------------------------------------------------------------------
# 6. HorizontalPodAutoscaler for team workload scaling
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: open-jev-hpa
  namespace: jev-model
  labels:
    app: open-jev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: open-jev
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
---
# -----------------------------------------------------------------------------
# 7. Prometheus ServiceMonitor for team dashboards
# -----------------------------------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: open-jev-monitor
  namespace: jev-model
  labels:
    app: open-jev
    release: prometheus
spec:
  selector:
    matchLabels:
      app: open-jev
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http
  namespaceSelector:
    matchNames:
      - jev-model
---
# -----------------------------------------------------------------------------
